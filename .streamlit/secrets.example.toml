# Copy this file to .streamlit/secrets.toml for local development.
# For Streamlit Cloud or GitHub-hosted deployment, enter the same values in the app secrets panel.
# Do not commit real credentials to GitHub.

[app]
SMTP_SERVER = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USERNAME = "your-account@gmail.com"
SMTP_PASSWORD = "your-16-character-gmail-app-password"
TWILIO_ACCOUNT_SID = "ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
TWILIO_AUTH_TOKEN = "your-twilio-auth-token"
TWILIO_FROM_NUMBER = "+12345678901"
DEPT_MUNICIPAL_EMAIL = "municipal@justiceconnect.gov"
DEPT_POLICE_EMAIL = "police@justiceconnect.gov"
DEPT_ELECTRICITY_EMAIL = "electricity@justiceconnect.gov"
DEPT_WATER_EMAIL = "watersupply@justiceconnect.gov"
DEPT_TRANSPORT_EMAIL = "transport@justiceconnect.gov"
DEPT_REVENUE_EMAIL = "revenue@justiceconnect.gov"
DEPT_EDUCATION_EMAIL = "education@justiceconnect.gov"
DEPT_HEALTH_EMAIL = "health@justiceconnect.gov"
DEPT_OTHER_EMAIL = "support@justiceconnect.gov"
